<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>قهوة الدومينو</title><style>body{margin:0;background:#1d1108}.dm-app{max-width:720px;margin:0 auto;padding:16px;font-family:system-ui,sans-serif;color:#1b1b1b}
.dm-title{font-size:28px;margin:0 0 4px}
.dm-sub{margin:0 0 12px;color:#555;font-size:14px}
.dm-status{background:#f3efe6;border-radius:12px;padding:10px 14px;font-weight:600;margin-bottom:14px;min-height:22px}
.dm-section{margin-bottom:14px}
.dm-label{font-size:13px;color:#666;margin-bottom:6px}
.dm-row{display:flex;flex-wrap:wrap;gap:6px}
.dm-board{display:flex;flex-wrap:wrap;gap:4px;background:#1f6b4a;border-radius:14px;padding:12px;min-height:88px;align-items:center}
.dm-empty{color:#cfe8dc;font-size:14px;margin:auto}
.dm-tile{display:flex;flex-direction:column;align-items:center;gap:0;width:34px;height:66px;background:#fffdf5;border:2px solid #2a2a2a;border-radius:7px;padding:2px;cursor:pointer;opacity:.5}
.dm-tile.hint{opacity:1;border-color:#d68a00;box-shadow:0 0 0 2px #ffcf66}
.dm-tile.board{opacity:1;cursor:default;width:30px;height:58px}
.dm-tile.back{opacity:1;background:repeating-linear-gradient(45deg,#3b4a8a,#3b4a8a 4px,#4c5ca3 4px,#4c5ca3 8px);cursor:default}
.dm-half{display:grid;grid-template-columns:repeat(3,1fr);grid-template-rows:repeat(3,1fr);width:100%;flex:1;padding:2px}
.dm-half i{display:block;border-radius:50%;margin:1px}
.dm-half i.on{background:#1b1b1b}
.dm-bar{display:block;height:2px;width:80%;background:#2a2a2a}
.dm-actions{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin:10px 0}
.dm-btn{border:1px solid #bbb;background:#fff;border-radius:10px;padding:10px 16px;font-size:15px;cursor:pointer}
.dm-btn:disabled{opacity:.4;cursor:default}
.dm-btn.primary{background:#1f6b4a;color:#fff;border-color:#1f6b4a}
.dm-note{font-size:12px;color:#777}

.dm-app{background:#3a2314 repeating-linear-gradient(90deg,rgba(0,0,0,.08) 0 2px,transparent 2px 14px);color:#f6e7c8;border-radius:16px;padding:16px;font-family:'Segoe UI',Tahoma,sans-serif}
.dm-sign{text-align:center;border:3px double #e0b25a;border-radius:12px;padding:8px;margin-bottom:10px;background:#7a1f1f}
.dm-title{color:#ffd978;margin:0;font-size:30px}
.dm-tag{color:#f6e7c8;font-size:13px}
.dm-sub{color:#e8d3a8}
.dm-status{background:#f3e2b8;color:#3a2314;border:2px solid #e0b25a}
.dm-label{color:#e0b25a}
.dm-board{background:#14573d;border:6px solid #8b5a2b;box-shadow:inset 0 0 20px rgba(0,0,0,.5)}
.dm-tile{background:#fbf3dc}
.dm-btn{background:#f3e2b8;color:#3a2314;border-color:#e0b25a}
.dm-btn.primary{background:#7a1f1f;color:#ffd978;border-color:#e0b25a}
.dm-note{color:#e8d3a8}
.dm-glass{font-size:28px;text-align:center}
.dm-app{background:radial-gradient(ellipse at 50% 0%,#6b4a2a 0,#2b1a0e 70%)}
.dm-board{background:repeating-linear-gradient(92deg,rgba(0,0,0,.12) 0 1px,transparent 1px 9px),repeating-linear-gradient(0deg,rgba(255,255,255,.04) 0 3px,transparent 3px 40px),linear-gradient(135deg,#9a6a3a,#7a5028 50%,#8f6030);border:8px solid #4a2c14;border-radius:10px;box-shadow:inset 0 0 25px rgba(0,0,0,.55),0 6px 14px rgba(0,0,0,.5);min-height:100px}
.dm-empty{color:#f0dcb4;text-shadow:0 1px 2px #000}
.dm-tile{box-shadow:0 2px 3px rgba(0,0,0,.45)}
.dm-tile.board{box-shadow:1px 3px 4px rgba(0,0,0,.6)}
.dm-sign{background:#5a1a12;border-color:#c9973f}
.dm-arab{height:10px;margin:4px 0;background:repeating-linear-gradient(90deg,#2aa6a0 0 10px,#ffd978 10px 14px,#c0392b 14px 24px,#ffd978 24px 28px);border-radius:3px}
.dm-sign{background:#5a1a12 radial-gradient(circle at 50% 50%,rgba(255,217,120,.12) 0,transparent 60%)}
.dm-box{background:repeating-linear-gradient(92deg,rgba(0,0,0,.18) 0 1px,transparent 1px 8px),linear-gradient(135deg,#6b4423,#4a2c14 60%,#5b3a1c);border:6px solid #2e1a0a;outline:2px solid #c9973f;outline-offset:-10px;border-radius:12px;padding:12px;box-shadow:inset 0 0 22px rgba(0,0,0,.6),0 6px 14px rgba(0,0,0,.55)}
.dm-boxlid{text-align:center;color:#ffd978;font-weight:700;border-bottom:2px dashed #c9973f;padding-bottom:6px;margin-bottom:8px;letter-spacing:.5px}
.dm-box .dm-label{color:#f0dcb4}
.dm-fig{margin:0 0 12px;border:4px solid #c9973f;border-radius:8px;overflow:hidden;background:#000}.dm-fig img{display:block;width:100%;height:150px;object-fit:cover;filter:sepia(.35)}.dm-fig figcaption{font-size:10px;color:#e8d3a8;padding:4px 8px;background:#2b1a0e}

.dm-top{display:flex;align-items:flex-start;gap:8px;margin-bottom:6px}
.dm-lantern{width:28px;height:56px;flex:none}
.dm-khaya{flex:1;height:44px;border-radius:4px;border:2px solid #c9973f;background:
 conic-gradient(from 45deg at 50% 50%,#b3261e 0 25%,#1f7f86 0 50%,#b3261e 0 75%,#e8b93a 0) 0 0/22px 22px}
.dm-tea{width:16px;height:22px;vertical-align:middle;margin-inline-start:4px}
