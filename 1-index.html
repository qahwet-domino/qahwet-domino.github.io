<!doctype html>
<html lang="ar" dir="rtl"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>قهوة الدومينو</title>
<link rel="manifest" href="manifest.webmanifest"><meta name="theme-color" content="#3a190e"><link rel="icon" href="icon-192.png"><link rel="apple-touch-icon" href="icon-192.png">
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overflow:hidden;background:#120804;font-family:"Tajawal","Noto Sans Arabic","Segoe UI",Tahoma,sans-serif;color:#f7e7c4;touch-action:none;user-select:none}
#c{position:fixed;inset:0;width:100%;height:100%;display:block}
.top{position:fixed;top:0;left:0;right:0;padding:calc(8px + env(safe-area-inset-top)) 10px 0;display:flex;gap:8px;align-items:flex-start;justify-content:space-between;pointer-events:none}
.pill{background:linear-gradient(#4b1d12cc,#2a0e08cc);border:1.5px solid #c9973f;border-radius:14px;padding:4px 9px;font-weight:700;font-size:13px;box-shadow:0 3px 10px #0008;display:flex;white-space:nowrap;gap:6px;align-items:center;backdrop-filter:blur(3px)}
.pill b{color:#ffd978;font-size:18px}
@media(max-width:345px){.pill{font-size:11px;padding:3px 6px;gap:4px}.pill b{font-size:15px}#snd{padding:6px 8px;font-size:15px}.top{gap:4px}}
#chatb{position:fixed;left:14px;bottom:calc(14px + env(safe-area-inset-bottom));width:44px;height:44px;border-radius:50%;font-size:22px;line-height:1;background:linear-gradient(#5a2a1a,#3a190e);border:2px solid #c9973f;color:#fff;padding:0;box-shadow:0 3px 0 #1d0a04;pointer-events:auto;z-index:6}
#chat{position:fixed;left:0;right:0;bottom:0;z-index:7;background:linear-gradient(#3a1a0f,#1f0b05);border-top:2px solid #c9973f;border-radius:18px 18px 0 0;padding:8px 10px calc(10px + env(safe-area-inset-bottom));transform:translateY(105%);transition:transform .22s;max-height:60vh;display:flex;flex-direction:column;gap:6px}
#chat.on{transform:none}
#chead{display:flex;justify-content:space-between;align-items:center;font-weight:800;color:#ffd978;font-size:14px}
#cx{background:none;border:none;color:#fff;font-size:18px;padding:2px 8px;box-shadow:none}
#clog{height:64px;overflow-y:auto;font-size:13px;background:#0006;border-radius:10px;padding:4px 8px}
.cl.me{color:#7fe0e8}.cl.bot{color:#ffd978}
#cq{display:flex;flex-wrap:wrap;gap:5px}
.chip{padding:5px 10px;font-size:13px;border-radius:14px;background:#5a2a1a;color:#fff;border:1px solid #c9973f;box-shadow:none}
#ce{display:flex;gap:6px;justify-content:space-between}
.emo{flex:1;font-size:24px;padding:3px 0;border-radius:12px;background:#5a2a1a;border:1px solid #c9973f;box-shadow:none}
#cform{display:flex;gap:6px}
#cin{flex:1;font-size:15px;padding:7px 10px;border-radius:12px;border:1.5px solid #c9973f;background:#fff7e0;color:#3a1d0e;min-width:0}
#csend{padding:7px 14px;font-size:14px;background:linear-gradient(#1f7f86,#14575c);color:#fff;border-radius:12px;border:1.5px solid #7fe0e8}
#timer{position:fixed;right:14px;bottom:calc(14px + env(safe-area-inset-bottom));width:44px;height:44px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:20px;color:#ffd978;background:#2a0e08dd;border:2px solid #c9973f;opacity:0;transition:opacity .2s;pointer-events:none}#timer.on{opacity:1}#timer.low{color:#fff;background:#a3201a;border-color:#ff9a8a;animation:tp .5s infinite alternate}@keyframes tp{to{transform:scale(1.15)}}
#banner{max-width:calc(100vw - 130px)!important;position:fixed;bottom:calc(16px + env(safe-area-inset-bottom));left:50%;transform:translateX(-50%);padding:5px 14px;max-width:92vw;overflow:hidden;text-overflow:ellipsis;border-radius:20px;font-weight:700;font-size:14px;white-space:nowrap;background:#2a0e08cc;border:1.5px solid #c9973f;pointer-events:none;transition:opacity .2s}
#banner:empty{opacity:0}
#banner.you{background:linear-gradient(#1f7f86,#14575c);border-color:#7fe0e8}
#banner.opp{background:linear-gradient(#7a1b16,#4b0f0c)}
#banner.warn{background:linear-gradient(#c9973f,#8a6420);color:#2a0e08}
#bubbleX{position:fixed;bottom:calc(58px + env(safe-area-inset-bottom));left:50%;transform:translateX(-50%) scale(.8);background:#fff7e0;color:#3a1d0e;padding:4px 12px;border-radius:16px;font-weight:700;font-size:13px;opacity:0;transition:all .25s;pointer-events:none;box-shadow:0 4px 12px #0008;max-width:80%;text-align:center}
#bubbleX.on{opacity:1;transform:translateX(-50%) scale(1)}
.bar{position:fixed;bottom:0;left:0;right:0;padding:0 10px calc(12px + env(safe-area-inset-bottom));display:flex;gap:10px;justify-content:center;align-items:center}
button{font-family:inherit;font-weight:800;font-size:16px;color:#2a0e08;border:0;border-radius:16px;padding:12px 20px;background:linear-gradient(#ffe08a,#c9973f);box-shadow:0 4px 0 #7a5316,0 8px 16px #0008;cursor:pointer}
button:active{transform:translateY(3px);box-shadow:0 1px 0 #7a5316}
button:disabled{opacity:.4;filter:grayscale(.6)}
#snd{padding:8px 12px;font-size:18px;background:linear-gradient(#5a2a1a,#3a190e);color:#fff;box-shadow:0 3px 0 #1d0a04;border:1.5px solid #c9973f;pointer-events:auto}
#snd.on{background:linear-gradient(#1f7f86,#14575c)}
#vol{width:56px;margin:0}#volwrap{display:none;pointer-events:auto;background:#2a0e08cc;border:1.5px solid #c9973f;border-radius:14px;padding:6px 8px;align-items:center}
#volwrap.on{display:flex}
input[type=range]{width:90px;accent-color:#e8b93a}
.right{display:flex;flex-direction:column;gap:6px;align-items:flex-start;pointer-events:none}
.right>*{pointer-events:auto}
#menu,#overlay,#loading{position:fixed;inset:0;display:none;align-items:center;justify-content:center;flex-direction:column;text-align:center;padding:24px;background:radial-gradient(ellipse at center,#00000055,#000000cc)}
#menu.on,#overlay.on,#loading.on{display:flex}
h1{font-size:46px;margin:0 0 6px;color:#ffd978;text-shadow:0 3px 0 #7a1b16,0 8px 24px #000;letter-spacing:1px}
.sub{font-size:16px;margin:0 0 28px;opacity:.9;max-width:300px;line-height:1.6}
.card{background:linear-gradient(#4b1d12ee,#2a0e08ee);border:2px solid #c9973f;border-radius:22px;padding:26px 30px;box-shadow:0 10px 40px #000}
#start{font-size:22px;padding:14px 44px}
.small{font-size:12px;opacity:.7;margin-top:18px}
#rtitle{font-size:25px;line-height:1.3;color:#ffd978;margin:0 0 8px}
#rmsg{margin:0 0 18px;font-size:16px}
</style></head><body>
<canvas id="c"></canvas>
<div class="top">
 <div class="pill"><span id="lp">أنت</span><b id="sp">0</b><span>|</span><span id="lo">الأسطى</span><b id="so">0</b><span style="font-size:11px;opacity:.75;margin-inline-start:2px">لحد 100</span></div>

 <div class="pill" style="font-size:11px;padding:3px 8px;gap:4px"><span id="pill2"></span></div></div>
</div>
<button id="chatb">💬</button>
<div id="chat"><div id="chead"><span>شات مع الأسطى</span><button id="cx">✕</button></div><div id="clog"></div><div id="cq"></div><div id="ce"></div><form id="cform" autocomplete="off"><input id="cin" maxlength="60" placeholder="اكتب رسالة..."><button id="csend" type="submit">إرسال</button></form></div>
<div id="timer">10</div><div id="banner"></div>
<div class="bar"><button id="hint" style="display:none">تلميح</button><button id="draw" style="display:none">اسحب <span id="drawn">0</span></button></div>
