*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overflow:hidden;background:#120804;font-family:"Tajawal","Noto Sans Arabic","Segoe UI",Tahoma,sans-serif;color:#f7e7c4;touch-action:none;user-select:none}

#cx{background:none;border:none;color:#fff;font-size:18px;padding:2px 8px;box-shadow:none}

.emo{flex:1;font-size:24px;padding:3px 0;border-radius:12px;background:#5a2a1a;border:1px solid #c9973f;box-shadow:none}

#cin{flex:1;font-size:15px;padding:7px 10px;border-radius:12px;border:1.5px solid #c9973f;background:#fff7e0;color:#3a1d0e;min-width:0}

#banner.warn{background:linear-gradient(#c9973f,#8a6420);color:#2a0e08}

#bubbleX.on{opacity:1;transform:translateX(-50%) scale(1)}
.bar{position:fixed;bottom:0;left:0;right:0;padding:0 10px calc(12px + env(safe-area-inset-bottom));display:flex;gap:10px;justify-content:center;align-items:center}
button{font-family:inherit;font-weight:800;font-size:16px;color:#2a0e08;border:0;border-radius:16px;padding:12px 20px;background:linear-gradient(#ffe08a,#c9973f);box-shadow:0 4px 0 #7a5316,0 8px 16px #0008;cursor:pointer}
button:active{transform:translateY(3px);box-shadow:0 1px 0 #7a5316}
button:disabled{opacity:.4;filter:grayscale(.6)}
#snd{padding:8px 12px;font-size:18px;background:linear-gradient(#5a2a1a,#3a190e);color:#fff;box-shadow:0 3px 0 #1d0a04;border:1.5px solid #c9973f;pointer-events:auto}
#snd.on{background:linear-gradient(#1f7f86,#14575c)}
#vol{width:56px;margin:0}#volwrap{display:none;pointer-events:auto;background:#2a0e08cc;border:1.5px solid #c9973f;border-radius:14px;padding:6px 8px;align-items:center}
#volwrap.on{display:flex}
input[type=range]{width:90px;accent-color:#e8b93a}
.right{display:flex;flex-direction:column;gap:6px;align-items:flex-start;pointer-events:none}
.right>*{pointer-events:auto}

#lobby{position:fixed;inset:0;display:none;flex-direction:column;align-items:center;padding:14px 14px calc(14px + env(safe-area-inset-bottom));background:radial-gradient(ellipse at center,#1a0a04ee,#000000f2);overflow-y:auto;z-index:20;direction:rtl}
#lobby.on{display:flex}
#lobby .card{width:100%;max-width:420px;padding:16px 16px;margin-bottom:10px;text-align:center}
#lobby h2{margin:0 0 8px;font-size:20px;color:#ffe08a}
#lobby .row{display:flex;gap:8px;margin:8px 0;align-items:center;justify-content:center;flex-wrap:wrap}

#lobby label{font-size:13px;opacity:.85;display:block;text-align:right;margin-top:6px}
#lobby input{width:100%;box-sizing:border-box;padding:10px;border-radius:12px;border:1.5px solid #7a5316;background:#1d0b05;color:#f7e7c4;font-size:16px;text-align:center;font-family:inherit}
#lobby .fr{display:flex;align-items:center;gap:8px;padding:8px 6px;border-bottom:1px solid #ffffff18;text-align:right}

#lobby .fr button{padding:5px 12px;font-size:13px;border-radius:10px}
